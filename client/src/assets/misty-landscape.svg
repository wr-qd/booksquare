<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f0ff"/>
      <stop offset="0.55" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>

    <linearGradient id="mount1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d3f3"/>
      <stop offset="1" stop-color="#cfe2f7"/>
    </linearGradient>

    <linearGradient id="mount2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd7ee"/>
      <stop offset="1" stop-color="#c9dff4"/>
    </linearGradient>

    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="blur14" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <radialGradient id="sun" cx="0.75" cy="0.18" r="0.35">
      <stop offset="0" stop-color="#fff7da" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fff7da" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff7da" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse">
      <g opacity="0.10" fill="#000">
        <circle cx="12" cy="22" r="1"/>
        <circle cx="44" cy="70" r="1"/>
        <circle cx="90" cy="18" r="1"/>
        <circle cx="120" cy="58" r="1"/>
        <circle cx="160" cy="34" r="1"/>
        <circle cx="22" cy="120" r="1"/>
        <circle cx="78" cy="132" r="1"/>
        <circle cx="148" cy="140" r="1"/>
      </g>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- far mountains -->
  <path filter="url(#blur14)" opacity="0.55" fill="url(#mount2)"
        d="M0,520 C180,470 320,520 480,490 C650,455 760,520 930,500 C1100,480 1240,525 1400,505 C1500,492 1560,500 1600,510 L1600,900 L0,900 Z"/>

  <!-- mid mountains -->
  <path filter="url(#blur8)" opacity="0.62" fill="url(#mount1)"
        d="M0,610 C190,560 330,630 520,600 C690,575 780,635 960,615 C1130,595 1250,650 1410,625 C1505,610 1565,615 1600,620 L1600,900 L0,900 Z"/>

  <!-- gentle hills -->
  <path opacity="0.70" fill="#eef3ff"
        d="M0,710 C240,690 360,740 560,720 C770,698 880,760 1060,740 C1260,720 1380,770 1600,750 L1600,900 L0,900 Z"/>

  <!-- fog layers -->
  <g filter="url(#blur14)">
    <rect x="-40" y="560" width="1680" height="120" fill="url(#fog)" opacity="0.60"/>
    <rect x="-40" y="640" width="1680" height="140" fill="url(#fog)" opacity="0.50"/>
    <rect x="-40" y="740" width="1680" height="180" fill="url(#fog)" opacity="0.55"/>
  </g>

  <!-- subtle grain -->
  <rect width="1600" height="900" fill="url(#grain)" opacity="0.18"/>
</svg>
